<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact page for the Pulse Studio animated GSAP template." />
    <title>Contact | Pulse Studio</title>
    <script type="module" crossorigin src="/assets/main-GvXa3rZj.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-B9KgW5vn.css">
  </head>
  <body data-page="contact">
    <header class="site-header" data-animate="fade-down">
      <a class="brand" href="/" aria-label="Pulse Studio home">
        <span class="brand-mark"></span>
        Pulse Studio
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="/work.html">Work</a>
        <a href="/about.html">About</a>
        <a href="/pricing.html">Pricing</a>
        <a href="/use-template.html" data-template-nav>Template</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <a class="nav-action" href="/contact.html">Start</a>
    </header>

    <main>
      <section class="contact-layout">
        <div data-animate="fade-up">
          <p class="eyebrow">Contact</p>
          <h1>Tell us what you are launching.</h1>
          <p class="hero-text">
            Use this page as a polished lead capture template with animated form fields and reusable layout patterns.
          </p>
        </div>
        <form class="contact-form" data-animate="scale-in">
          <label>
            Name
            <input type="text" name="name" placeholder="Your name" />
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="you@example.com" />
          </label>
          <label>
            Project
            <textarea name="project" rows="5" placeholder="What are you building?"></textarea>
          </label>
          <button class="button primary" type="submit">Send Message</button>
        </form>
      </section>
    </main>

  </body>
</html>
